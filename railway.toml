[build]
builder = "nixpacks"

[deploy]
startCommand = "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn victimes_pesticides.wsgi:application --bind 0.0.0.0:${PORT:-8000}"
healthcheckPath = "/admin/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
