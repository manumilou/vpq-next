[build]
builder = "nixpacks"

[deploy]
startCommand = "bash import_data_once.sh && python manage.py migrate && python manage.py collectstatic --noinput && gunicorn victimes_pesticides.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2 --log-level info --access-logfile - --error-logfile -"
healthcheckPath = "/admin/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
