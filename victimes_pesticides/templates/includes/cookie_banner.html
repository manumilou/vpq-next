{% load static %}

{# Cookie Consent Banner #}
<div id="cookieBanner" class="cookie-banner" style="display: none;">
    <div class="cookie-banner-content">
        <div class="cookie-banner-text">
            <h3 class="cookie-banner-title">Respect de votre vie privée</h3>
            <p class="cookie-banner-description">
                Nous utilisons des cookies pour analyser le trafic de notre site et améliorer votre expérience.
                Vos données sont anonymisées et ne sont jamais partagées avec des tiers.
                <a href="/politique-de-t%C3%A9moins/" class="cookie-banner-link">En savoir plus</a>
            </p>
        </div>
        <div class="cookie-banner-actions">
            <button onclick="acceptCookies()" class="cookie-banner-button cookie-banner-accept">
                Accepter
            </button>
            <button onclick="refuseCookies()" class="cookie-banner-button cookie-banner-refuse">
                Refuser
            </button>
        </div>
    </div>
</div>

<script>
    function showCookieBannerIfNeeded() {
        var banner = document.getElementById('cookieBanner');
        if (!banner) {
            return;
        }

        var consent = localStorage.getItem('ga_consent');
        if (!consent) {
            banner.style.display = 'block';
        }
    }

    function hideCookieBanner() {
        var banner = document.getElementById('cookieBanner');
        if (banner) {
            banner.style.display = 'none';
        }
    }

    function deleteCookie(name) {
        var hostnameParts = window.location.hostname.split('.');
        var domains = ['', window.location.hostname];

        if (hostnameParts.length > 2) {
            domains.push('.' + hostnameParts.slice(-2).join('.'));
        }

        domains.forEach(function(domain) {
            document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/' + (domain ? '; domain=' + domain : '');
        });
    }

    function deleteGoogleAnalyticsCookies() {
        document.cookie.split(';').forEach(function(cookie) {
            var name = cookie.split('=')[0].trim();
            if (name === '_ga' || name === '_gid' || name.indexOf('_ga_') === 0) {
                deleteCookie(name);
            }
        });
    }

    // Show banner if user hasn't made a choice
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', showCookieBannerIfNeeded);
    } else {
        showCookieBannerIfNeeded();
    }

    window.acceptCookies = function() {
        localStorage.setItem('ga_consent', 'accepted');
        hideCookieBanner();

        if (typeof window.loadGoogleAnalytics === 'function') {
            window.loadGoogleAnalytics();
        }

        if (typeof gtag === 'function') {
            gtag('event', 'cookie_consent', {
                'event_category': 'engagement',
                'event_label': 'accepted'
            });
        }
    };

    window.refuseCookies = function() {
        localStorage.setItem('ga_consent', 'refused');
        hideCookieBanner();
        deleteGoogleAnalyticsCookies();

        if (typeof gtag === 'function') {
            gtag('consent', 'update', {
                'analytics_storage': 'denied'
            });
        }
    };

    // Used by the privacy policy page to let users change their choice.
    window.resetCookieConsent = function() {
        localStorage.removeItem('ga_consent');
        deleteGoogleAnalyticsCookies();
        location.reload();
    };
</script>
