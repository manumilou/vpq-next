{% load static %}

{# Cookie Consent Banner #}
<div id="cookieBanner" class="cookie-banner" style="display: none;">
    <div class="cookie-banner-content">
        <div class="cookie-banner-text">
            <h3 class="cookie-banner-title">Respect de votre vie privée</h3>
            <p class="cookie-banner-description">
                Nous utilisons des cookies pour analyser le trafic de notre site et améliorer votre expérience.
                Vos données sont anonymisées et ne sont jamais partagées avec des tiers.
                <a href="/politique-de-t%C3%A9moins/" class="cookie-banner-link">En savoir plus</a>
            </p>
        </div>
        <div class="cookie-banner-actions">
            <button onclick="acceptCookies()" class="cookie-banner-button cookie-banner-accept">
                Accepter
            </button>
            <button onclick="refuseCookies()" class="cookie-banner-button cookie-banner-refuse">
                Refuser
            </button>
        </div>
    </div>
</div>

<script>
    function getCookieConsent() {
        try {
            return localStorage.getItem('ga_consent');
        } catch (error) {
            return null;
        }
    }

    function setCookieConsent(value) {
        try {
            localStorage.setItem('ga_consent', value);
        } catch (error) {
            // Ignore storage failures; the current click should still work for this page view.
        }
    }

    function removeCookieConsent() {
        try {
            localStorage.removeItem('ga_consent');
        } catch (error) {
            // Ignore storage failures and still reload below.
        }
    }

    // Show banner if user hasn't made a valid choice
    (function() {
        var consent = getCookieConsent();
        if (consent !== 'accepted' && consent !== 'refused') {
            document.getElementById('cookieBanner').style.display = 'block';
        }
    })();

    function acceptCookies() {
        setCookieConsent('accepted');
        document.getElementById('cookieBanner').style.display = 'none';

        // Load Google Analytics
        if (typeof loadGoogleAnalytics === 'function') {
            loadGoogleAnalytics();
        }

        // Track acceptance event
        if (typeof gtag === 'function') {
            gtag('event', 'cookie_consent', {
                'event_category': 'engagement',
                'event_label': 'accepted'
            });
        }
    }

    function refuseCookies() {
        setCookieConsent('refused');
        document.getElementById('cookieBanner').style.display = 'none';

        // Track refusal event (without storing data)
        if (typeof gtag === 'function') {
            gtag('event', 'cookie_consent', {
                'event_category': 'engagement',
                'event_label': 'refused'
            });
        }
    }

    // Allow users to change their mind from the privacy/cookie policy page
    function resetCookieConsent() {
        removeCookieConsent();
        location.reload();
    }
</script>
